services:       
                
  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    volumes:
      - ${CONFIGS_PATH}prowlarr/config:/config
      - ${CONFIGS_PATH}prowlarr/backup:/data/Backup
      - /home/ofirking/media/qbittorrent_downloads:/downloads
    restart: unless-stopped
    env_file:
      - '.env'

  flaresolverr:
    image: flaresolverr/flaresolverr:v3.3.24
    container_name: flaresolverr
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    restart: unless-stopped
    env_file:
      - '.env' 

  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    volumes:
      - ${CONFIGS_PATH}sonarr/config:/config
      - ${CONFIGS_PATH}sonarr:/data/Backup
      - ${CONFIGS_PATH}sonarr/data:/data/tvshows
      - /home/ofirking/media/qbittorrent_downloads:/downloads
    restart: unless-stopped
    env_file:
      - '.env'
    
  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    volumes:
      - ${CONFIGS_PATH}radarr/config:/config
      - ${CONFIGS_PATH}radarr:/data/movies
      - ${CONFIGS_PATH}radarr/data:/data/Backup
      - /home/ofirking/media/qbittorrent_downloads:/downloads
    restart: unless-stopped
    env_file:
      - '.env'
                                           
  lidarr:
    image: linuxserver/lidarr:latest
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    container_name: lidarr
    volumes:
      - ${CONFIGS_PATH}lidarr/config:/config
      - ${CONFIGS_PATH}lidarr/data:/data/musicfolder
      - /home/ofirking/media/qbittorrent_downloads:/downloads
    restart: unless-stopped
    env_file:
      - '.env'
                                                                                                               
