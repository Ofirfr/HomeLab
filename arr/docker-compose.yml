  jellyfin:
    image: linuxserver/jellyfin
    container_name: jellyfin
    devices:
      # - /dev/dri
      - /dev/dri/card0
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - "109" # Change this to match your "render" host group id and remove this comment
    
    ports:
      - '8096:8096/tcp'   # Jellyfin web interface
      - '7359:7359/udp'   # Network discovery
      - '1900:1900/udp'   # DLNA port
    volumes:
      - ${CONFIGS_PATH}jellyfin/config:/config
      - ${CONFIGS_PATH}radarr:/data/Movies
      - ${CONFIGS_PATH}sonarr:/data/TVShows
      - ${CONFIGS_PATH}lidarr:/data/Music
      - ${CONFIGS_PATH}readarr:/data/Books
    environment:
      - DOCKER_MODS=linuxserver/mods:jellyfin-opencl-intel
    env_file:
      - '.env'
    restart: unless-stopped
  
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN  # Required for WireGuard
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1  # Disable IPv6 leaks
    restart: unless-stopped
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${CONFIGS_PATH}gluetun:/gluetun  # Stores VPN configs and logs
      - /home/ofirking/wireguard:/gluetun/wireguard  # WireGuard config folder
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - VPN_INTERFACE=wg0
      - DOT=off
      - HEALTH_VPN_DURATION_INITIAL=120s
      - FIREWALL_VPN_INPUT_PORTS="${VPN_PORT_FORWARDED}"
      - FIREWALL_OUTBOUND_SUBNETS=192.168.10.0/24  # Allow LAN access to Web UI
      - VPN_PORT_FORWARDING=off  # Enable AirVPN port forwarding
    ports:
      - "8080:8080"  # Web UI for qBittorrent
      - "${VPN_PORT_FORWARDED}:${VPN_PORT_FORWARDED}" # Port for qBittorrent
      - "${VPN_PORT_FORWARDED}:${VPN_PORT_FORWARDED}/udp" # Port for qBittorrent
      - "8686:8686" # Lidarr
      - "8989:8989" # Sonarr
      - "9696:9696" # Prowlarr
      - "7575:7575" # Homarr
      - "7878:7878" # Radarr
      - "8191:8191" # FlareSolverr

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    volumes:
      - ${CONFIGS_PATH}qbittorrent/config:/config
      - /home/ofirking/media/qbittorrent_downloads:/downloads
    environment:
      - WEBUI_PORT=8080
    healthcheck:
      start_period: 15s
    env_file:
      - '.env'

