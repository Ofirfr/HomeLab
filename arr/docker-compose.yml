services:       
                
  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    hostname: prowlarr
    volumes:
      - ${CONFIGS_PATH}Prowlarr/config:/config
      - prowlarr_media:/data/Backup
      - media_downloads:/downloads
    ports:
      - 9696:9696
    restart: unless-stopped
    env_file:
      - '.env'

  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    hostname: flaresolverr
    ports:
      - 8191:8191
    restart: unless-stopped
    env_file:
      - '.env' 

  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    hostname: sonarr
    volumes:
      - ${CONFIGS_PATH}Sonarr/config:/config
      - sonarr_media:/data/Backup
      - sonarr_media:/data/tvshows
      - media_downloads:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped
    env_file:
      - '.env'
    
  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    hostname: radarr
    volumes:
      - ${CONFIGS_PATH}Radarr/config:/config
      - radarr_media:/data/movies
      - radarr_media:/data/Backup
      - media_downloads:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped
    env_file:
      - '.env'
                                           
  lidarr:
    image: linuxserver/lidarr:latest
    container_name: lidarr
    hostname: lidarr
    volumes:
      - ${CONFIGS_PATH}Lidarr/config:/config
      - lidarr_media:/data/musicfolder
      - media_downloads:/downloads
    ports:
      - 8686:8686
    restart: unless-stopped
    env_file:
      - '.env'
                                                                                                               
  readarr:
    image: linuxserver/readarr:develop
    container_name: readarr
    hostname: readarr
    volumes:
      - ${CONFIGS_PATH}Readarr/config:/config
      - readarr_media:/data/books
      - media_downloads:/downloads
    ports:
      - 8787:8787
    restart: unless-stopped
    env_file:
      - '.env'
 
  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:latest
    restart: unless-stopped
    volumes:
      - ${CONFIGS_PATH}Homarr/configs:/app/data/configs
      - ${CONFIGS_PATH}Homarr/icons:/app/public/icons
      - ${CONFIGS_PATH}Homarr/data:/data
    ports:
      - '7575:7575'
    env_file:
      - '.env'
     
  jellyfin:
    image: linuxserver/jellyfin
    container_name: jellyfin
    ports:
      - '8096:8096/tcp'   # Jellyfin web interface
      - '7359:7359/udp'   # Network discovery
      - '1900:1900/udp'   # DLNA port
    volumes:
      - ${CONFIGS_PATH}Jellyfin/config:/config
      - radarr_media:/data/Movies
      - sonarr_media:/data/TVShows
      - lidarr_media:/data/Music
      - readarr_media:/data/Books
    env_file:
      - '.env'
    restart: unless-stopped
                                                                                             
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    hostname: qbittorrent
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    volumes:
      - ${CONFIGS_PATH}qbittorrent/config:/config
      - media_downloads:/downloads
    ports:
      - 8080:8080
      - ${QBITTORRENT_LISTEN_PORT}:${QBITTORRENT_LISTEN_PORT}
      - ${QBITTORRENT_LISTEN_PORT}:${QBITTORRENT_LISTEN_PORT}/udp
    environment:
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    healthcheck:
      start_period: 15s
    env_file:
      - '.env'

volumes:
  media_downloads:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=192.168.10.199,rw,nfsvers=4"
      device: ":/mnt/single_disk_test/mnt/arr_new/downloads/"
  lidarr_media:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=192.168.10.199,rw,nfsvers=4"
      device: ":/mnt/single_disk_test/mnt/arr_new/lidarr/"
  homarr_media:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=192.168.10.199,rw,nfsvers=4"
      device: ":/mnt/single_disk_test/mnt/arr_new/homarr/"
  prowlarr_media:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=192.168.10.199,rw,nfsvers=4"
      device: ":/mnt/single_disk_test/mnt/arr_new/prowlarr/"
  sonarr_media:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=192.168.10.199,rw,nfsvers=4"
      device: ":/mnt/single_disk_test/mnt/arr_new/sonarr/"
  radarr_media:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=192.168.10.199,rw,nfsvers=4"
      device: ":/mnt/single_disk_test/mnt/arr_new/radarr/"
  readarr_media:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=192.168.10.199,rw,nfsvers=4"
      device: ":/mnt/single_disk_test/mnt/arr_new/readarr/"