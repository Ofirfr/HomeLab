services:
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - /nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /nginx/conf.d:/etc/nginx/conf.d:ro
      - /nginx/certs:/etc/nginx/certs:ro
      - /nginx/logs:/var/log/nginx
    networks:
      - proxy

networks:
  proxy:
    driver: bridge
