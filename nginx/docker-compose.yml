services:
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - /nginx/certs:/etc/letsencrypt:ro
      - /nginx/logs:/var/log/nginx
      - /nginx/webroot:/var/www/certbot
    networks:
      - proxy

networks:
  proxy:
    driver: bridge
